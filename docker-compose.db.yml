# Self-hosting with PostgreSQL: docker compose -f docker-compose.db.yml up -d
# Development:                  docker compose -f docker-compose.db.yml up --build
# Needs POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB in .env (see .env.example).
services:
  app:
    image: ${IMAGE:-eacer/jira-workloginator:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE: postgres
      # URL-encode special characters in the password
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    # The image's HEALTHCHECK already runs (`/app healthcheck` -> /healthz).
    # Uncomment to change its timings, or use `disable: true` to turn it off.
    # healthcheck:
    #   test: ["CMD", "/app", "healthcheck"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
